# Scrapes every AgriLink service on the internal Docker network.
# /metrics is never routed by the public gateway.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: agrilink
    # Docker DNS returns one A record per replica, so scaled services are
    # all scraped automatically.
    dns_sd_configs:
      - names: [auth-service]
        type: A
        port: 4001
      - names: [farmer-service]
        type: A
        port: 4002
      - names: [supplier-service]
        type: A
        port: 4003
      - names: [marketplace-service]
        type: A
        port: 4004
      - names: [notification-service]
        type: A
        port: 4005
      - names: [ml-service]
        type: A
        port: 4006
      - names: [blockchain-service]
        type: A
        port: 4007
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: '(.+)-service'
        target_label: app

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
