# Shared gateway routes — included by nginx.conf (hybrid dev) and
# nginx.docker.conf (full Docker / production). Upstreams are defined there.

# ── Rate limiting (per real client IP) ────────────────────────
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_zone:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=heavy_zone:10m rate=2r/s;
limit_req_status 429;

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Behind Caddy / a load balancer: trust X-Forwarded-For from private ranges
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
server_tokens off;
client_max_body_size 20M;

gzip on;
gzip_types application/json text/plain application/javascript text/css;
gzip_min_length 1024;

log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                '$request_time rid=$request_id up=$upstream_addr';
access_log /dev/stdout main;
error_log /dev/stderr warn;

server {
  listen 80;
  server_name _;

  add_header X-Request-ID $request_id always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Connection "";

  # ── Never expose service-to-service endpoints ─────────────
  location ~ ^/[a-z]+/internal(/|$) { return 404; }
  # Swagger UIs are for local development only
  location ~ ^/[a-z]+/docs(/|$)     { return 404; }

  location /auth/ {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass http://auth;
    proxy_read_timeout 30s;
  }

  location /farmer/ {
    limit_req zone=api_zone burst=40 nodelay;
    proxy_pass http://farmer;
    proxy_read_timeout 120s;    # OCR uploads call the ML service
  }

  location /supplier/ {
    limit_req zone=api_zone burst=40 nodelay;
    proxy_pass http://supplier;
    proxy_read_timeout 60s;
  }

  location = /marketplace/payment/webhook {
    # Razorpay → us (server-to-server). No per-IP throttling surprises.
    proxy_pass http://marketplace;
    proxy_read_timeout 30s;
  }

  location /marketplace/ {
    limit_req zone=api_zone burst=40 nodelay;
    proxy_pass http://marketplace;
    proxy_read_timeout 30s;
  }

  location /ml/ {
    limit_req zone=heavy_zone burst=10 nodelay;
    proxy_pass http://ml;
    proxy_read_timeout 120s;    # OCR / scraping can be slow
  }

  location /blockchain/ {
    limit_req zone=heavy_zone burst=10 nodelay;
    proxy_pass http://blockchain;
    proxy_read_timeout 180s;    # waits for on-chain confirmation
  }

  # ── Notifications: REST + Socket.IO (WebSocket) ───────────
  location /notification/ {
    proxy_pass http://notification;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","gateway":"agrilink"}';
  }

  location / {
    default_type application/json;
    return 404 '{"success":false,"error":"Route not found"}';
  }
}
