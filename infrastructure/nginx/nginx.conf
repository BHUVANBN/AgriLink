# Hybrid local development: infrastructure in Docker, services on the host
# (`pnpm dev`). Used by `make infra`.
events { worker_connections 1024; }

http {
  upstream auth         { server host.docker.internal:4001; keepalive 16; }
  upstream farmer       { server host.docker.internal:4002; keepalive 16; }
  upstream supplier     { server host.docker.internal:4003; keepalive 16; }
  upstream marketplace  { server host.docker.internal:4004; keepalive 16; }
  upstream notification { server host.docker.internal:4005; }
  upstream ml           { server host.docker.internal:4006; keepalive 8; }
  upstream blockchain   { server host.docker.internal:4007; keepalive 8; }

  include /etc/nginx/agrilink/routes.conf;
}
