# Full Docker / production: every service runs as a container.
# Scale a service with `docker compose up -d --scale marketplace-service=3`
# then `docker compose exec api-gateway nginx -s reload` — nginx round-robins
# across all replicas behind the service name.
events { worker_connections 4096; }

http {
  upstream auth         { server auth-service:4001;        keepalive 32; }
  upstream farmer       { server farmer-service:4002;      keepalive 32; }
  upstream supplier     { server supplier-service:4003;    keepalive 32; }
  upstream marketplace  { server marketplace-service:4004; keepalive 32; }
  # Sticky by client IP so Socket.IO long-polling fallback stays on one replica
  upstream notification { ip_hash; server notification-service:4005; }
  upstream ml           { server ml-service:4006;          keepalive 8; }
  upstream blockchain   { server blockchain-service:4007;  keepalive 8; }

  include /etc/nginx/agrilink/routes.conf;
}
