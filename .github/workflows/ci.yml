name: AgriLink CI 🌾

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Services — typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Generate Prisma clients
        run: pnpm -r --filter './services/*' --if-present run db:generate
      - name: Typecheck services
        run: pnpm -r --filter './services/*' --filter '!@agrilink/ml-service' --if-present run lint
      - name: Unit tests
        run: pnpm -r --filter './packages/*' --filter './services/*' --filter '!@agrilink/blockchain' --filter '!@agrilink/ml-service' --if-present run test
        env:
          JWT_ACCESS_SECRET: ci-test-secret

  contracts:
    name: Smart contract — compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@agrilink/blockchain..."
      - run: pnpm --filter @agrilink/blockchain run compile
      - name: ABI is up to date
        run: git diff --exit-code services/blockchain/src/abi.ts
      - run: pnpm --filter @agrilink/blockchain test

  ml:
    name: ML service — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I services/ml_service/tests/test_forecasting.py
      - run: python -I services/ml_service/tests/test_aadhaar.py
      - name: Syntax check
        run: python -m compileall -q services/ml_service

  monitoring:
    name: Monitoring config — validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config + alert rules
        run: |
          docker run --rm -v $PWD/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
            -v $PWD/infrastructure/prometheus/rules.yml:/etc/prometheus/rules.yml:ro \
            --entrypoint promtool prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@agrilink/web..."
      - run: pnpm --filter @agrilink/web exec tsc --noEmit
      - run: pnpm --filter @agrilink/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [node, contracts]
    strategy:
      matrix:
        service: [auth, farmer, supplier, marketplace, notification, blockchain]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/node-service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
